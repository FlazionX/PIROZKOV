name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - "build.bat"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --collect-all PySide6 --name PIROZKOV main.py

      - name: Prepare assets folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/assets/photos | Out-Null
          Copy-Item assets/README.txt dist/assets/README.txt -ErrorAction SilentlyContinue

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIROZKOV-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 14
