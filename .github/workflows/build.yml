name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - "build.bat"
      - "desktop_icons.cpp"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native desktop icon helper
        shell: pwsh
        run: |
          cl /nologo /O2 /EHsc /LD desktop_icons.cpp /Fe:desktop_icons.dll /link ole32.lib oleaut32.lib shell32.lib
          if ($LASTEXITCODE -ne 0) { throw "Native desktop icon helper build failed" }

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --hidden-import PySide6.QtMultimedia --collect-all PySide6.QtMultimedia --add-binary "desktop_icons.dll;." --name PIROZKOV main.py

      - name: Prepare assets folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/PIROZKOV/assets/photos | Out-Null
          Copy-Item assets/README.txt dist/PIROZKOV/assets/README.txt -ErrorAction SilentlyContinue
          if (Test-Path assets/samo_soboy.mp3) { Copy-Item assets/samo_soboy.mp3 dist/PIROZKOV/assets/ }
          if (Test-Path assets/captions.srt) { Copy-Item assets/captions.srt dist/PIROZKOV/assets/ }
          if (Test-Path assets/photos) { Copy-Item assets/photos/* dist/PIROZKOV/assets/photos/ -Recurse -Force }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIROZKOV-Windows
          path: dist/PIROZKOV/
          if-no-files-found: error
          retention-days: 14
